<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>Calendar App</title>
        <script src="static/js/fillTimes.js"></script>
        <script src="static/js/buttonScripts.js"></script>
        <link href="static/css/main.css" rel="stylesheet">
    </head>
    
    <body>
        <h1>KK 2000 Nails Appointment View</h1>
        <p id="small-text">made by Colton Federighi</p>
        <hr>

        <div class="horizontalGrid" style="grid-template-columns: 200px 200px 200px 1fr 200px 200px 200px; justify-content: start;">
            <button class="controlButtonFiller">Current Week:</button>
            <button type="button" class="controlButton" id="weekPrevious">Previous Week</button>
            <button type="button" class="controlButton" id="weekNext">Next Week</button>
            <div class="verticalLine"></div>
            <button type="button" class="controlButton" id="localFileSave">Save Changes to Local</button>
            <button type="button" class="controlButton" id="localFileLoad">Load from Local</button>
            <button type="button" class="controlButton" id="serverFileSave">Save Changes to Server</button>
            <button type="button" class="controlButton" id="serverFileLoad">Load from Server</button>
        </div>
        
        <hr>

        <div class="tableRoot">
            <div class="tableDay">
                <p class="tableDayItem">Monday</p>
                <div class="tableTimes" id="mondayTimes"></div>
            </div>
            <div class="tableDay">
                <p class="tableDayItem">Tuesday</p>
                <div class="tableTimes" id="tuesdayTimes"></div>
            </div>
            <div class="tableDay">
                <p class="tableDayItem">Wednesday</p>
                <div class="tableTimes" id="wednesdayTimes"></div>
            </div>
            <div class="tableDay">
                <p class="tableDayItem">Thursday</p>
                <div class="tableTimes" id="thursdayTimes"></div>
            </div>
            <div class="tableDay">
                <p class="tableDayItem">Friday</p>
                <div class="tableTimes" id="fridayTimes"></div>
            </div>
            <div class="tableDay">
                <p class="tableDayItem">Saturday</p>
                <div class="tableTimes" id="saturdayTimes"></div>
            </div>
        </div>
    </body>
</html>
